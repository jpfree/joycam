name: Build JoyCam (All Platforms)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: native
            cross: ""
          - os: ubuntu-22.04
            target: armhf
            cross: "arm-linux-gnueabihf-"
          - os: ubuntu-22.04
            target: arm64
            cross: "aarch64-linux-gnu-"
          - os: ubuntu-22.04
            target: riscv64
            cross: "riscv64-linux-gnu-"
          - os: macos-14
            target: macos-arm64
            cross: ""
          - os: macos-13
            target: macos-x86_64
            cross: ""
          - os: windows-latest
            target: windows-x86_64
            cross: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux cross compilers
        if: runner.os == 'Linux' && matrix.cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu upx-ucl

      - name: Install UPX (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install upx

      - name: Install Windows MinGW + UPX
        if: runner.os == 'Windows'
        run: |
          choco install mingw
          choco install upx

      - name: Build (Linux native or cross)
        if: runner.os == 'Linux'
        run: |
          make clean || true
          CROSS=${{ matrix.cross }} make
          mkdir -p out/${{ matrix.target }}
          cp crsf_rx crsf_tx ibus_rx ibus_tx sbus_rx sbus_tx joystick out/${{ matrix.target }}/

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          make clean || true
          make
          mkdir -p out/${{ matrix.target }}
          cp crsf_rx crsf_tx ibus_rx ibus_tx sbus_rx sbus_tx joystick out/${{ matrix.target }}/

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          make clean || true
          make CC=x86_64-w64-mingw32-gcc
          mkdir -p out/${{ matrix.target }}
          cp crsf_rx.exe crsf_tx.exe ibus_rx.exe ibus_tx.exe sbus_rx.exe sbus_tx.exe joystick.exe out/${{ matrix.target }}/

      - name: Strip + UPX compress
        run: |
          cd out/${{ matrix.target }}
          for f in *; do
            if [[ -f "$f" ]]; then
              strip "$f" || true
              upx --best --lzma "$f" || true
            fi
          done

      - name: Generate OpenIPC install script
        if: matrix.target == 'armhf' || matrix.target == 'arm64'
        run: |
          mkdir -p out/${{ matrix.target }}

          # install_openipc.sh (base64 safe)
          cat << 'EOF' | base64 -d > out/${{ matrix.target }}/install_openipc.sh

EOF
          chmod +x out/${{ matrix.target }}/install_openipc.sh

          # joycam.service (base64 safe)
          cat << 'EOF' | base64 -d > out/${{ matrix.target }}/joycam.service
W1VuaXRdCkRlc2NyaXB0aW9uPUpveUNhbSBJbnB1dCBCcmlkZ2UKQWZ0ZXI9bmV0d29yay50YXJnZXQKCltTZXJ2aWNlXQpFeGVjU3RhcnQ9L3Vzci9iaW4vY3JzZl9yeApSZXN0YXJ0PWFsd2F5cwoKW0luc3RhbGxdCldhbnRlZEJ5PW11bHRpLXVzZXIudGFyZ2V0Cg==
EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joycam-${{ matrix.target }}
          path: out/${{ matrix.target }}
