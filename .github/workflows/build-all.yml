name: Build JoyCam (Linux + ARM + RISC-V)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: native
            cross: ""
          - target: armhf
            cross: "arm-linux-gnueabihf-"
          - target: arm64
            cross: "aarch64-linux-gnu-"
          - target: riscv64
            cross: "riscv64-linux-gnu-"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu upx-ucl

      - name: Build
        run: |
          make clean || true
          CROSS=${{ matrix.cross }} make
          mkdir -p out/${{ matrix.target }}
          cp crsf_rx crsf_tx ibus_rx ibus_tx sbus_rx sbus_tx joystick out/${{ matrix.target }}/

      - name: Strip + UPX compress
        run: |
          cd out/${{ matrix.target }}
          for f in *; do
            if [[ -f "$f" ]]; then
              strip "$f" || true
              upx --best --lzma "$f" || true
            fi
          done

      - name: Generate OpenIPC install script
        if: matrix.target == 'armhf' || matrix.target == 'arm64'
        run: |
          mkdir -p out/${{ matrix.target }}

          # install_openipc.sh (base64 safe)
          echo "" | base64 -d > out/${{ matrix.target }}/install_openipc.sh
          chmod +x out/${{ matrix.target }}/install_openipc.sh

          # joycam.service (base64 safe)
          echo "W1VuaXRdCkRlc2NyaXB0aW9uPUpveUNhbSBJbnB1dCBCcmlkZ2UKQWZ0ZXI9bmV0d29yay50YXJnZXQKCltTZXJ2aWNlXQpFeGVjU3RhcnQ9L3Vzci9iaW4vY3JzZl9yeApSZXN0YXJ0PWFsd2F5cwoKW0luc3RhbGxdCldhbnRlZEJ5PW11bHRpLXVzZXIudGFyZ2V0Cg==" | base64 -d > out/${{ matrix.target }}/joycam.service

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joycam-${{ matrix.target }}
          path: out/${{ matrix.target }}
